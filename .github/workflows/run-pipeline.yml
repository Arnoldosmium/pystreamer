name: Run Pipeline

on:
  push:
    branches: [ develop ]
    tags:
      - '*'
  pull_request:
    branches: [ develop ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        fetch-tags: true
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest wheel
        if [ "${{ matrix.python-version }}" = "3.12" ]; then
            pip install setuptools
        fi

    - name: Run tests
      run: pytest
    
    - name: Build package
      run: |
        git describe --tags
        ./render_setup.sh
        python setup.py build --dry-run

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'

    environment:
      name: pypi
      url: https://pypi.org/p/pystreamer
    permissions:
      id-token: write
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 2
        fetch-tags: true
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install wheel
    
    - name: Build package
      run: |
        ./render_setup.sh
        python setup.py sdist bdist_wheel
    
    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
      with:
        verbose: true
        repository-url: ${{ !contains(github.ref, 'refs/tags/') && 'https://test.pypi.org/legacy/' || '' }}
        username: __token__
        password: ${{ !contains(github.ref, 'refs/tags/') && secrets.TEST_PYPI_API_TOKEN || secrets.PYPI_API_TOKEN }}
